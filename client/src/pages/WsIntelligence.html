x;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.msg{align-self:flex-start;max-width:90%;padding:10px 13px;border:1px solid #9bdcff28;background:#071522b8;backdrop-filter:blur(12px);border-radius:12px;font-size:12px;line-height:1.55;color:#d9efff;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#15334aab}.msg.error{border-color:#ff9d9d66;color:#ffd1d1}.hint{line-height:1.8;max-width:200px}

<script>
/* ===== WS Intelligence — motor conversacional local (sem backend, sem API externa) ===== */
(function(){
"use strict";
const $=s=>document.querySelector(s),P=v=>{try{window.pulse&&window.pulse(v)}catch(e){}};
const REV="11/2026";
const WSQ="Como me tornar paciente na WS Connection?";
const AVISO="Conteúdo informativo e educacional; não substitui avaliação médica individualizada. Não use para diagnóstico, dose ou automedicação.";
/* ---------- Base de conhecimento (modular; migrável para banco de dados) ---------- */
function E(id,c,t,k,txt,ev,ref,sug,steps){return{id,c,t,k,txt,ev,ref,sug:sug||[],steps:steps||null,rev:REV}}
const KB=[
E("basico","fund","Cannabis sativa L. e fitocanabinoides","cannabis planta sativa fitocanabinoide fitocanabinoides canabinoides tricoma tricomas terpeno terpenos flavonoide flavonoides canhamo medicinal quimica composicao","A Cannabis sativa L. produz fitocanabinoides, terpenos e flavonoides, concentrados principalmente nos tricomas glandulares das inflorescências. \"Cânhamo industrial\" designa variedades de baixo THC usadas para fibra e sementes; \"Cannabis medicinal\" refere-se a produtos com finalidade terapêutica sob regras sanitárias. A composição química varia conforme cultivar, cultivo e processamento, e isso influencia os efeitos farmacológicos.","Conhecimento estabelecido",["Mechoulam R. e colaboradores — literatura clássica de química dos canabinoides"],["O que é o CBD?","O que é o THC?","Qual a diferença entre espectro completo e isolado?"]),
E("cbd","fund","CBD — Canabidiol","cbd canabidiol epidiolex","O CBD não é intoxicante e tem baixa afinidade direta por CB1/CB2; seus efeitos envolvem múltiplos alvos, ainda em parte sob investigação. Efeitos adversos descritos: sonolência, diarreia, redução do apetite e elevação de enzimas hepáticas. Inibe enzimas do CYP450 e pode interagir com outros fármacos (por exemplo, clobazam e valproato). O CBD foi isolado em 1940 (Roger Adams).","Farmacologia estabelecida; alvos moleculares em investigação",["Devinsky O. et al., N Engl J Med, 2017","Adams R. et al., J Am Chem Soc, 1940"],["Quais as interações medicamentosas dos canabinoides?","Cannabis e epilepsia"]),
E("thc","fund","THC — Tetrahidrocanabinol","thc tetrahidrocanabinol psicoativo euforia intoxicante","O THC é agonista parcial de CB1 e CB2 e responsável pelos efeitos psicoativos. Pode causar tontura, taquicardia, alterações de memória e atenção, ansiedade e, em pessoas vulneráveis, sintomas psiquiátricos; há risco de tolerância e dependência. Sua estrutura foi identificada em 1964 por Gaoni e Mechoulam.","Farmacologia estabelecida",["Gaoni Y., Mechoulam R., J Am Chem Soc, 1964","NASEM, The Health Effects of Cannabis and Cannabinoids, 2017"],["Quais os riscos e efeitos adversos?","O que é o sistema endocanabinoide?"]),
E("outros","fund","CBG, CBN, CBC, THCV e CBDV","cbg canabigerol cbn canabinol cbc canabicromeno thcv tetrahidrocanabivarina cbdv canabidivarina menores raros","O CBG é precursor biossintético dos demais canabinoides; o CBN surge principalmente da degradação oxidativa do THC; CBC, THCV e CBDV são outros constituintes menores. Para a maioria deles, o conhecimento é majoritariamente pré-clínico, com poucos ensaios clínicos em humanos.","Evidência experimental",["Revisões de farmacologia dos fitocanabinoides (consulte PubMed)"],["O que é descarboxilação?","O que é CBD?"]),
E("acidos","fund","Canabinoides ácidos, neutros e descarboxilação","acido acidos neutro neutros descarboxilacao decarboxilacao cbda thca biossintese calor aquecimento","Na planta, os canabinoides são sintetizados em forma ácida (CBGA, depois THCA e CBDA). A descarboxilação, perda de CO₂ por calor ou tempo, converte-os nas formas neutras (THC, CBD). Ácidos e neutros têm perfis farmacológicos diferentes, e o grau de conversão depende do processamento do produto.","Conhecimento estabelecido",["Literatura de biossíntese dos fitocanabinoides"],["O que é CBD?","Quais as formas de administração?"]),
E("espectro","fund","Espectro completo, amplo espectro e isolados","espectro completo amplo isolado isolados entourage comitiva full broad formulacao formulacoes","Espectro completo contém vários canabinoides e terpenos, inclusive THC; amplo espectro costuma não conter THC; isolado contém um único canabinoide. A hipótese de sinergia entre componentes (\"efeito comitiva\") é debatida e ainda carece de evidência clínica robusta. A eficácia de um produto específico não se extrapola para a planta em geral.","Hipótese farmacológica",["Russo E.B., Br J Pharmacol, 2011 (hipótese do efeito comitiva)"],["Quais as formas de administração?"]),
E("sec","sec","Sistema endocanabinoide","endocanabinoide endocanabinoides sec cb1 cb2 anandamida aea 2-ag faah magl receptor receptores homeostase sinalizacao retrograda sinapse","O sistema endocanabinoide inclui os receptores CB1 (abundantes no sistema nervoso central) e CB2 (mais ligados ao sistema imune), os ligantes anandamida (AEA) e 2-AG, e as enzimas FAAH e MAGL, que os degradam. Atua por sinalização retrógrada modulando a neurotransmissão e participa da regulação de dor, inflamação, sono, apetite, memória e emoção. Marcos: receptor CB1 (1988, clonado em 1990), anandamida (1992), CB2 (1993), 2-AG (1995). O que é demonstrado: papel modulador em modelos pré-clínicos e humanos; ainda em investigação: extensão da relevância terapêutica em muitas doenças.","Ciência estabelecida; aplicações clínicas em investigação",["Devane W.A. et al., Science, 1992","Matsuda L.A. et al., Nature, 1990","Munro S. et al., Nature, 1993"],["Cannabis ajuda a dormir?","Qual a história da descoberta dos canabinoides?"]),
E("adm","adm","Formas de administração","oleo oleos solucao sublingual capsula capsulas comprimido comprimidos oromucosa spray topico topicos transdermico transdermicos administracao biodisponibilidade absorcao via vias formas apresentacoes inalacao","Óleos e soluções orais e formulações sublinguais/oromucosas diferem em absorção e início de ação; cápsulas e comprimidos passam pelo metabolismo hepático de primeira passagem, com biodisponibilidade oral baixa e variável; produtos tópicos e transdérmicos têm ação local ou sistêmica limitada conforme a formulação. O início e a duração dos efeitos variam bastante entre pessoas e produtos. Este conteúdo não traz receitas, concentrações ou instruções de uso: isso cabe ao prescritor.","Evidência varia por produto e indicação",["Millar S.A. et al., Front Pharmacol, 2018 (farmacocinética dos canabinoides)"],["Quais as interações medicamentosas?","Qual a regulamentação no Brasil?"]),
E("epilepsia","pat","Epilepsia, Dravet e Lennox-Gastaut","epilepsia epilepticas convulsao convulsoes crise crises dravet lennox gastaut lgs esclerose tuberosa refrataria anticonvulsivante","Para as síndromes de Dravet e Lennox-Gastaut e para esclerose tuberosa, o CBD purificado (Epidiolex) teve ensaios clínicos randomizados controlados por placebo e aprovação pelo FDA, como terapia adjuvante. Isso vale para esse produto farmacêutico e essas síndromes, não para epilepsias em geral nem para extratos sem padronização. Riscos: sonolência, diarreia, elevação de transaminases e interação com clobazam. Exige acompanhamento neurológico.","Evidência alta (CBD purificado em Dravet e LGS); baixa para outros contextos",["Devinsky O. et al., N Engl J Med, 2017 (Dravet)","Devinsky O. et al., N Engl J Med, 2018 (Lennox-Gastaut)","FDA — aprovação do Epidiolex, 2018"],["Quais as interações medicamentosas?","Cannabis e dor crônica"]),
E("sono","pat","Sono e insônia","sono insonia dormir dormindo sonolencia insonias disturbio disturbios ritmo circadiano","Há estudos pequenos e heterogêneos sobre canabinoides e sono, e algumas melhoras subjetivas foram relatadas, mas não há evidência robusta que sustente indicação para insônia. O THC pode alterar a arquitetura do sono, e o uso crônico pode levar a tolerância e piora na retirada. O sistema endocanabinoide participa dos ritmos biológicos (mecanismo em investigação). Insônia persistente merece avaliação médica para identificar causas.","Evidência baixa a insuficiente",["NASEM, 2017","Revisões sistemáticas sobre canabinoides e sono (consulte PubMed/Cochrane)"],["O que é o sistema endocanabinoide?","E no caso da ansiedade?"]),
E("ansiedade","pat","Ansiedade, estresse e depressão","ansiedade ansioso panico estresse depressao depressivo tept ptsd trauma fobia humor emocional","Para ansiedade, há estudos pequenos com CBD em situações como o falar em público e a fobia social, mas faltam ensaios grandes e de longo prazo. Para depressão e TEPT, a evidência é insuficiente. O THC pode piorar ansiedade e desencadear sintomas psiquiátricos em pessoas vulneráveis. Os tratamentos convencionais (psicoterapia, antidepressivos) têm evidência bem estabelecida e não devem ser interrompidos sem orientação médica.","Evidência baixa (ansiedade); muito baixa/insuficiente (depressão, TEPT)",["Bergamaschi M.M. et al., Neuropsychopharmacology, 2011","NASEM, 2017"],["Cannabis ajuda a dormir?","Quais os riscos e efeitos adversos?"]),
E("dor","pat","Dor crônica, neuropática e fibromialgia","dor dores cronica neuropatica fibromialgia artrite oncologica inflamacao inflamatoria analgesia","Para dor crônica em adultos, revisões encontram benefício em parte dos pacientes, em geral modesto, com mais efeitos adversos que o placebo. Na dor neuropática, a evidência é de baixa a moderada; em fibromialgia e artrite, é baixa ou insuficiente. Riscos: sedação, tontura, alterações cognitivas e dependência (especialmente com THC). Não substitui avaliação e tratamento convencionais.","Evidência moderada a baixa (efeito modesto)",["Whiting P.F. et al., JAMA, 2015","NASEM, 2017"],["Quais os riscos e efeitos adversos?","Cannabis e espasticidade"]),
E("espasticidade","pat","Esclerose múltipla e espasticidade","esclerose multipla espasticidade espasmo espasmos rigidez nabiximols sativex mevatyl","Em esclerose múltipla, o nabiximols (extrato com THC e CBD em spray oromucoso) tem ensaios clínicos e autorização em vários países, inclusive o Brasil, para espasticidade moderada a grave refratária a outros tratamentos, com benefício principalmente subjetivo. Efeitos comuns: tontura, fadiga e sonolência. Indicação restrita a esse produto e contexto.","Evidência moderada (nabiximols, espasticidade em EM)",["Whiting P.F. et al., JAMA, 2015","NASEM, 2017"],["Quais as formas de administração?","Quais os riscos?"]),
E("nausea","pat","Náuseas e vômitos da quimioterapia","nausea nauseas vomito vomitos quimioterapia quimio dronabinol nabilona oncologia paliativo paliativos","Canabinoides sintéticos (dronabinol, nabilona) foram avaliados contra náuseas e vômitos da quimioterapia, com evidência de benefício em alguns estudos, mas os antieméticos modernos são a primeira linha. Efeitos adversos como sonolência, tontura e boca seca são frequentes. Nos cuidados paliativos, as evidências para sintomas variados são limitadas.","Evidência moderada (sintéticos, CINV); baixa em paliativos",["Smith L.A. et al., Cochrane Database Syst Rev, 2015"],["Quais os riscos?"]),
E("neuro","pat","Autismo, TDAH, Parkinson, Alzheimer e outras condições","autismo tea tdah parkinson alzheimer demencia neurodegenerativa neurodegenerativas neurodesenvolvimento movimento","Para autismo, TDAH, Parkinson, Alzheimer e outras condições neurodegenerativas, os dados atuais vêm de estudos pequenos, relatos de casos e pesquisas pré-clínicas. Não há evidência suficiente para estabelecer eficácia. Relatos de pacientes e estudos preliminares não equivalem a indicação comprovada, e o uso deve ser discutido com a equipe de saúde.","Evidência muito baixa/insuficiente ou experimental",["Revisões sistemáticas (consulte PubMed/Cochrane)"],["O que é o sistema endocanabinoide?","Quais os riscos?"]),
E("seguranca","seg","Segurança farmacológica e interações","risco riscos efeito efeitos adverso adversos colateral colaterais seguranca interacao interacoes medicamento medicamentos cyp450 cyp figado hepatico tolerancia dependencia contraindicacao gestacao gravidez amamentacao crianca criancas idoso idosos tontura sedacao","O CBD inibe enzimas do CYP450 (como CYP2C19 e CYP3A4) e pode elevar níveis de outros fármacos; o THC é metabolizado principalmente por CYP2C9 e CYP3A4. Efeitos comuns: sedação, tontura, alterações cognitivas e, com THC, ansiedade e dependência. Podem ocorrer alterações hepáticas, e o uso concomitante de sedativos pode somar efeitos. Gestação, amamentação, crianças, idosos e histórico psiquiátrico exigem especial cautela. Nunca suspenda ou troque medicamentos por conta própria; o acompanhamento clínico é essencial.","Farmacologia estabelecida",["Devinsky O. et al., N Engl J Med, 2017","NASEM, 2017"],["O que é o CBD?","Qual a regulamentação no Brasil?"]),
E("hist","hist","História da Cannabis medicinal no mundo","historia historico antiga china india egito grecia roma oshaughnessy convencao proibicao origem descoberta timeline linha tempo arqueologia","Registros arqueobotânicos mostram uso humano antigo; materiais de Yanghai (Ásia Central, cerca de 2.700 anos) sugerem uso associado a ritos. Textos atribuídos à tradição chinesa (Shennong) são de datação debatida; interpretações sobre Egito e Grécia são acadêmicas e de menor certeza. William O'Shaughnessy introduziu a Cannabis na medicina ocidental (1839–1843). No século XX houve declínio por controles (Convenção Única, 1961). Em 1940 foi isolado o CBD; em 1964 foi identificada a estrutura do THC; em 1988–1990 foram identificados os receptores canabinoides.","Contexto histórico (parte interpretativa)",["Russo E.B. et al., J Exp Bot, 2008","Mechoulam R., Gaoni Y., 1964"],["O que é o sistema endocanabinoide?","Qual a história da Cannabis no Brasil?"]),
E("brasil","br","História da Cannabis no Brasil","brasil brasileira brasileiro historia cannabis colonia colonial portugal canhamo feitoria maconha pito pango familias associacoes pacientes","O cânhamo chegou ao Brasil no período colonial, com iniciativas de produção de fibra, como a Real Feitoria do Linho-Cânhamo (1783). Há registro de restrição ao \"pito do pango\" no Rio de Janeiro (1830). O controle federal se consolidou ao longo do século XX, e hoje a base é a Lei 11.343/2006. A partir de 2014–2015, famílias e associações de pacientes impulsionaram mudanças da Anvisa (CBD, importação). A linha do tempo completa e verificada ainda precisa ser expandida nesta base.","Contexto histórico",["Fontes históricas e normativas oficiais; consulte Anvisa e Planalto"],["Qual a regulamentação no Brasil?"]),
E("reg","reg","Regulamentação brasileira","lei anvisa rdc regulamentacao regulamento legal legislacao importacao importar prescricao autorizacao registro 660 327 1015 11343 judicial justica associacao cultivo comercializacao","Pilares: direito à saúde (Constituição Federal) e Lei 11.343/2006. A Anvisa distingue: (1) registro de medicamento; (2) autorização sanitária de produtos de Cannabis (RDC 327/2019); (3) importação por pessoa física com prescrição (RDC 660/2022, que substituiu a RDC 335/2020). Importar um produto não autoriza cultivo, fabricação ou comercialização. A RDC 1.015/2026 foi citada no escopo do projeto, mas seu texto não foi verificado nesta base. Consulte sempre a norma vigente no site da Anvisa; não use normas revogadas como vigentes.","Norma jurídica — verificar texto vigente na Anvisa",["Lei 11.343/2006","RDC 327/2019, RDC 660/2022 (Anvisa)"],["Qual a história da Cannabis no Brasil?","Quais as formas de administração?"],""),

function search(q){
  const n=norm(q),ts=toks(q).map(w=>stem(SYN[w]||w)).filter(Boolean),follow=/\b(essa|esse|isso|nessa|nesse|dela|dele|ela|ele)\b/.test(n)||ts.length<=1&&last;
  const ints=INT.filter(i=>i[0].test(n)).map(i=>i[1]);
  const sc=KB.map(e=>{let s=0;ts.forEach(t=>{const w=GEN[t]||1;if(e.bag.has(t))s+=w;if(e.tt.has(t))s+=1.2*w});
    if(follow&&last&&e.id===last.id&&s>0)s+=.3;
    if(follow&&last&&s===0&&ints.length&&last.sug&&e.id===last.id)s+=.8;
    if(ints.includes(e.c)&&s>0)s+=e.c==="br"?.4:1.5;
    if(ints.includes(e.c)&&follow&&last&&last.c===e.c)s+=.5;
    if(last&&e.c===last.c&&s>0)s+=.2;return{e,s}}).sort((a,b)=>b.s-a.s);
  if(follow&&last&&ts.length<=2&&!sc[0].s)return{best:last,list:[{e:last,s:1}],again:true};

  if(ints.length&&sc[0].s<1.5){const g=KB.find(e=>ints.includes(e.c));if(g)return{best:g,list:[{e:g,s:2}]}}
  return{best:sc[0].s>=.5?sc[0].e:null,list:sc.filter(x=>x.s>=.5).slice(0,3)};
}
